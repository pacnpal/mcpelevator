[project]
name = "mcpelevator"
# Source-metadata version (the importlib fallback in app.__init__ reads this for pip/uv installs
# from source). The published image derives its version from the release tag via MCPE_VERSION —
# see the Dockerfile / .github/workflows/docker-image.yml — so this need only track the dev line.
version = "1.6.0"
description = "Elevate stdio MCP servers into authenticated HTTP endpoints — self-hosted control plane."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.51.0",
    # <5: the bridge subclasses FastMCP 4 client internals (bridge.host
    # _HandshakeOnceProxyClient overrides Client._negotiate and
    # _await_with_session_monitoring), which a major release is free to rework.
    "fastmcp>=4.1.4,<5",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # FastMCP 4 and the MCP SDK v2 run on httpx2: the upstream-OAuth provider is an
    # httpx2.Auth, so app.auth drives it with httpx2 clients and catches httpx2 errors.
    "httpx2>=2.7",
    "python-multipart>=0.0.9",
    # Cloudflare Access assertion checks (app.auth.cf_access); crypto for RS256.
    "pyjwt[crypto]>=2.10",
    # YAML OpenAPI documents for the openapi runner (app.bridge.openapi).
    "pyyaml>=6",
    # GraphQL schemas (SDL or introspection), operation building and validation for the
    # graphql runner (app.bridge.graphql). The reference implementation, pure Python.
    "graphql-core>=3.2,<4",
    # Encrypts secret env values at rest (app.sealed). Already pulled in by pyjwt[crypto].
    "cryptography>=42",
    # Every .mcpb manifest is checked against the official schema before it's served
    # (app.mcpb). Already pulled in by the mcp SDK.
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # starlette.testclient prefers httpx2 (Pydantic's maintained httpx fork) and warns when it
    # falls back to httpx. The app's runtime HTTP client stays on `httpx` above; only the test
    # client needs httpx2, so it lives here.
    "httpx2>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
