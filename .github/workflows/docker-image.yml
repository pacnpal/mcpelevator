name: Build and Push Docker Image

# Builds the multi-arch image and pushes it to GHCR (ghcr.io/pacnpal/mcpelevator).
#
# Runs on GitHub-hosted runners (ubuntu-latest). Docker and buildx are
# pre-installed on GitHub-hosted runners, and arm64 layers are built via QEMU.
#
# Triggers:
#   - A pushed version tag (vX.Y.Z, optionally -prerelease) cuts a RELEASE.
#   - Manual workflow_dispatch with channel `release` cuts a release too: the
#     tag v<version> is created on the commit the run was dispatched from. If
#     the tag already exists it must point at that commit (dispatch from the tag
#     itself to regenerate an existing release's notes and rebuild its image).
#   - Manual workflow_dispatch with channel `dev` or `beta` builds any branch,
#     tag, or commit WITHOUT releasing. The image is published ONLY under
#     channel-prefixed tags (<channel>-<version> plus <channel>-sha-<short>) —
#     the release namespace (X.Y.Z, X.Y, X, latest, beta) is never created or
#     moved by those runs, so a dev/beta build can't clobber or impersonate a
#     release.
#
# A release first creates (or updates) the GitHub release, titled
# "vX.Y.Z - <title>", with a title and notes written by an OpenRouter free
# model from every commit since the previous v* tag
# (pacnpal/free-ai-release-notes), then builds the image. A version with a
# -prerelease part is published as a GitHub prerelease and moves `beta`
# instead of `latest`. A tag push for a release that already has notes (one
# published by hand from the UI) keeps them; a manual `release` run always
# rewrites them.
#
# Every published image is stamped with a real semver version (APP_VERSION),
# so the running instance reports e.g. `v1.2.3` — never `latest`/`dev`/a bare
# image tag. Anything that isn't full semver fails the run.
#
# Secrets: OPENROUTER_API_KEY (releases only; https://openrouter.ai/keys).
# GHCR auth and the GitHub release use the automatic GITHUB_TOKEN.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (full semver, e.g. 1.2.3 or v1.2.3-rc.1). For a release, the tag is v<version>"
        required: true
        type: string
      channel:
        description: "release = tag + GitHub release with AI notes + release image tags; dev/beta = image tagged <channel>-<version> only"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - beta
          - release

concurrency:
  # Releases and manual builds live in disjoint groups. ALL releases share one
  # `release` group so release builds SERIALIZE — this is load-bearing for
  # floating-tag correctness, not just throughput. "Check newest release" gates
  # latest/beta/X.Y/X on this version being the highest in its channel, but that
  # check and the eventual slow multi-arch tag push are far apart in the run; if
  # two releases built concurrently, an older release that gated latest=true
  # before a newer release was published could finish last and shove latest
  # backwards. Serializing keeps each release's check-then-push atomic relative
  # to other releases, so floating tags only ever move forward. (GitHub keeps
  # just ONE pending run per group, so a burst of 3+ releases inside a single
  # build window can drop a middle release's queued build — recoverable by
  # re-running that release, whereas an inverted `latest` would be silent
  # corruption, so serialization is the safer default.) A tag push and a manual
  # `release` dispatch are both releases and share the `release` group. dev/beta
  # builds serialize per channel — keyed on the channel, not the free-typed
  # version, so `v1.2.3` and `1.2.3` dispatches can't race the same image tag
  # from different groups. `cancel-in-progress: false` means a run never
  # cancels an in-flight run in its group: dispatching dev-1.2.4 must not kill
  # an in-flight dev-1.2.3 (each publishes a distinct tag).
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || inputs.channel == 'release') && 'release' || format('dispatch-{0}', inputs.channel) }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64
  # Strict full SemVer (X.Y.Z, optionally -prerelease), using the official
  # SemVer grammar for the prerelease part (non-empty dot-separated
  # identifiers; numeric identifiers can't have leading zeroes — 1.2.3-01 and
  # 1.2.3-. are invalid). Shared by "Resolve version" and the release
  # comparison set in "Check newest release".
  SEMVER_RE: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image_tag }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          # Tag push: the version is the tag. Manual dispatch: the version is the
          # required `version` input. Either way any leading `v` is stripped
          # (v1.2.3 -> 1.2.3).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            CHANNEL="$INPUT_CHANNEL"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL=release
          fi
          # Reject anything outside a safe tag charset before it reaches later steps.
          case "$VERSION" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "Invalid image tag: $VERSION" >&2
              exit 1
              ;;
          esac
          # A loose pattern is not enough now that the free-typed manual input
          # feeds the image tag (and, for a release, the git tag) directly:
          # 1.2.3.4 or 1.2.3foo must not publish. +build metadata is rejected
          # too ('+' can't appear in a docker tag; the charset check above
          # already refuses it). Every image has to carry a real version in
          # APP_VERSION so the running instance reports the version, never a
          # bare tag like "latest".
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "Refusing to build: version '$VERSION' is not a full semver (X.Y.Z[-prerelease])." >&2
            exit 1
          fi
          if [ "$CHANNEL" = "release" ]; then
            RELEASE=true
            TAG="v${VERSION}"
            IMAGE_TAG="${VERSION}"
          else
            # A dev/beta build may be of any ref, so its image tag is
            # namespaced by the channel (dev-1.2.3 / beta-1.2.3): it can never
            # collide with — or impersonate — a release's version tag.
            RELEASE=false
            TAG=""
            IMAGE_TAG="${CHANNEL}-${VERSION}"
          fi
          # SemVer: a version is a prerelease exactly when it has a -suffix.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          {
            echo "version=${VERSION}"
            echo "image_tag=${IMAGE_TAG}"
            echo "release=${RELEASE}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} (image tag: ${IMAGE_TAG}, release: ${RELEASE}, prerelease: ${PRERELEASE})"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [lint, version]
    if: needs.version.outputs.release == 'true'
    permissions:
      # Create the tag and release, and read GitHub's generated notes as context.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the notes cover every commit since the
          # previous v* tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag and existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A manual release tags the dispatched commit, and that commit is what
          # the image is built from. A tag that already exists elsewhere would
          # publish a release whose source and image disagree, so refuse it.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG} already exists at ${TAG_SHA}, not at the dispatched commit ${GITHUB_SHA}. Dispatch from the tag itself (Use workflow from: ${TAG}) or pick a new version."
              exit 1
            fi
          fi
          # A tag push for a release already published by hand keeps its
          # notes. A manual `release` run always (re)writes them.
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BODY" ]; then
            echo "Release ${TAG} already has notes; keeping them."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes and publish the release
        if: steps.existing.outputs.generate == 'true'
        uses: pacnpal/free-ai-release-notes@76e53c73233b9dfc37cb0aff5ed6359d139b4c7c # v1.0.0
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          tag: ${{ needs.version.outputs.tag }}
          target: ${{ github.sha }}
          # Only v* tags count as the previous release.
          tag-pattern: "v*"
          model: openrouter/free
          title-template: "{tag} - {title}"
          prerelease: ${{ needs.version.outputs.prerelease }}
          create-release: true
          instructions: |
            Write these notes in mcpelevator's house style. This style REPLACES the default
            layout, headings and emoji described above. Keep only the JSON response format,
            the rule that breaking changes come first, and the rule against inventing changes.

            Title: the release's two to four biggest user-facing changes as a short phrase or
            comma-separated list in plain words, e.g. "GraphQL runner, health checks,
            per-server caches, a better log viewer" or "Paste or upload an OpenAPI document".
            No version number, no emoji.

            Notes, in this order:

            1. Only if something breaks: the line `# ⚠️ **BREAKING CHANGES**`, a blank line,
               then the paragraph "**Read this before upgrading.** Each item says what
               changed, who it affects, and what to do instead. If nothing here describes
               your setup, the upgrade needs no action.", then `### **In X.Y.Z**` (this
               release's version without the leading v), then numbered items:
               **1. <One-sentence summary> (#PR).**
               - **What changed:** <the change, and why it was made>
               - **Affects you if:** <who will notice>
               - **Replace with:** <the exact setting, env var, command or step that keeps
                 them working>
               Then a line containing only `---`.
            2. `## vX.Y.Z - <the title>`, then one or two short paragraphs saying what the
               release adds or fixes and why it matters to someone running mcpelevator.
            3. One `## <Feature or fix name> (#PR, #PR)` section per significant change,
               biggest first. Explain it for the person running mcpelevator: where it is in
               the UI (bold labels, paths like **Settings → Idle shutdown**), the API route
               or field (`POST /api/servers/{id}/...`, `field_name`), the control MCP tool,
               and any env var with its default. For a fix, say what went wrong, the root
               cause, and what happens now. Use `###` subsections and bullets with a bold
               lead-in for long sections.
            4. `## Fixes`: smaller fixes, one bullet each with a bold lead-in sentence.
            5. `## Security`: security-relevant changes, and dependency bumps that fix an
               advisory (link GHSA or CVE ids only when the input names them).
            6. `## Dependencies`: bullets **Backend:**, **Frontend:** and **CI and image:**,
               each a comma-separated list like `fastmcp` 4.1.0 → 4.2.0 (#240), or just the
               new version when the old one isn't in the input. Every Renovate or
               dependency bump goes here and nowhere else.
            7. `## Upgrade notes for X.Y.Z`: bullets with a bold lead-in, e.g. **No migration
               step.** or **New environment variables:** `MCPE_...` (default `...`).

            Put a line containing only `---` between every two `##` sections. Leave out any
            section that would be empty. Do not add a "Full Changelog" link or a License
            section.

            Voice:
            - Plain and direct, second person ("you"), short declarative sentences.
            - No marketing words (powerful, seamless, robust, enhanced, exciting), no
              exclamation marks, no emoji other than the breaking-changes heading.
            - Concrete over vague: name the setting, field, env var, route, runner or file,
              in backticks.
            - Cite pull requests as (#123) after the heading or bullet they back, using only
              numbers that appear in the input.
            - Wrap prose at about 90 characters per line.
            - Leave out what users can't see (CI-only changes, refactors, tests, typo
              fixes) unless nothing else changed.

  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [lint, version, release]
    # A dev/beta build skips the release job; a release builds only once its
    # GitHub release exists.
    if: >-
      !cancelled() && needs.lint.result == 'success' && needs.version.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check newest release
        id: newest
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          IS_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Floating tags must only ever move forward. Queued release runs can
          # execute out of publish order (queue order is not guaranteed) and a
          # backport of an old line (e.g. v1.2.4 published after v2.0.0) is a
          # legitimate release, so each floating tag only moves when this
          # version is the HIGHEST SemVer in its channel across all published
          # releases: latest over stable releases, beta over prereleases,
          # X.Y/X over the stable releases sharing that prefix. Highest is
          # computed with true SemVer precedence rather than trusted from run
          # order or from /releases/latest (which sorts by created_at — the
          # commit date — so a backport cut from a fresh commit would wrongly
          # count as newest). curl -f makes any API failure fail this step
          # (and the build) loudly instead of silently mis-tagging.
          RELEASES=$(mktemp)
          PAGE=1
          while :; do
            RESP=$(curl -sfS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${PAGE}")
            COUNT=$(printf '%s' "$RESP" | jq 'length')
            printf '%s' "$RESP" | jq -r '.[] | select(.draft == false) | "\(.tag_name) \(.prerelease)"' >> "$RELEASES"
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          # The list API can lag the release job, so make sure this run's
          # own release is always in the comparison set.
          printf '%s %s\n' "$TAG" "$IS_PRERELEASE" >> "$RELEASES"
          # Only strictly-SemVer tags compete (SEMVER_RE is the workflow-level
          # grammar "Resolve version" also enforces): a stray non-SemVer release like
          # "docs-2026" — which this workflow refuses to build — must not sit
          # in the set and block the channels forever.
          STABLE=$(awk '$2 == "false" { sub(/^v/, "", $1); print $1 }' "$RELEASES" | grep -E "$SEMVER_RE" || true)
          PRE=$(awk '$2 == "true" { sub(/^v/, "", $1); print $1 }' "$RELEASES" | grep -E "$SEMVER_RE" || true)
          MAJOR=${VERSION%%.*}
          REST=${VERSION#*.}; MINOR=${REST%%.*}
          # True SemVer precedence: numeric prerelease identifiers rank below
          # alphanumeric ones and fields compare left-to-right. sort -V gets
          # this wrong (it ranks 1.0.0-alpha.1 above 1.0.0-alpha.beta), so an
          # older prerelease could repoint :beta backwards.
          cat > "$RUNNER_TEMP/semver_max.py" <<'PY'
          import sys

          def key(v):
              core, _, pre = v.partition("-")
              core_key = tuple(int(x) for x in core.split("."))
              if not pre:
                  return (core_key, (1, ()))
              ids = tuple(
                  (0, int(i), "") if i.isdigit() else (1, 0, i)
                  for i in pre.split(".")
              )
              return (core_key, (0, ids))

          versions = [line.strip() for line in sys.stdin if line.strip()]
          print(max(versions, key=key) if versions else "")
          PY
          gate() {
            if [ -n "$1" ] && [ "$(printf '%s\n' "$1" | python3 "$RUNNER_TEMP/semver_max.py")" = "$VERSION" ]; then
              echo true
            else
              echo false
            fi
          }
          MINOR_SET=$(printf '%s\n' "$STABLE" | grep -E "^${MAJOR}\.${MINOR}\." || true)
          MAJOR_SET=$(printf '%s\n' "$STABLE" | grep -E "^${MAJOR}\." || true)
          {
            echo "latest=$(gate "$STABLE")"
            echo "beta=$(gate "$PRE")"
            echo "minor=$(gate "$MINOR_SET")"
            echo "major=$(gate "$MAJOR_SET")"
          } >> "$GITHUB_OUTPUT"
          echo "Floating-tag gates for ${VERSION}: latest=$(gate "$STABLE") beta=$(gate "$PRE") ${MAJOR}.${MINOR}=$(gate "$MINOR_SET") ${MAJOR}=$(gate "$MAJOR_SET")"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          # latest is managed explicitly below — flavor `auto` would silently
          # re-add it for any stable semver build, including manual rebuilds of
          # old versions where moving `latest` backwards is exactly what the
          # floating_tags gate exists to prevent.
          flavor: |
            latest=false
          tags: |
            # The primary tag: the bare version on a release (1.2.3), the
            # channel-prefixed version on a dev/beta run (dev-1.2.3 / beta-1.2.3).
            type=raw,value=${{ needs.version.outputs.image-tag }}
            # The release namespace — floating X.Y/X plus latest (stable) and
            # beta (prerelease) — moves ONLY on a release; a dev/beta build
            # never creates or moves any of these. Each floating tag
            # further requires this version to be the highest in its channel
            # (see "Check newest release"), so floating tags only ever move
            # forward regardless of run order or backports.
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' && steps.newest.outputs.minor == 'true' }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' && steps.newest.outputs.major == 'true' && !startsWith(needs.version.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' && needs.version.outputs.prerelease != 'true' && steps.newest.outputs.latest == 'true' }}
            type=raw,value=beta,enable=${{ needs.version.outputs.release == 'true' && needs.version.outputs.prerelease == 'true' && steps.newest.outputs.beta == 'true' }}
            # always a git short SHA tag; on dev/beta runs it carries the channel
            # AND version (dev-1.2.3-sha-abc1234) so it can't overwrite the
            # release's sha tag, and re-dispatching the same commit with a
            # different version can't silently repoint one sha tag at images
            # stamped with different APP_VERSIONs
            type=sha,prefix=${{ needs.version.outputs.release != 'true' && format('{0}-{1}-sha-', inputs.channel, needs.version.outputs.version) || 'sha-' }},format=short
          labels: |
            org.opencontainers.image.title=mcpelevator
            org.opencontainers.image.description=Elevate stdio MCP servers into authenticated HTTP endpoints
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          # gha cache is fast (capped/evicted ~7 days); the GHCR :buildcache tag is
          # durable so a build after eviction still skips the slow QEMU arm64 layers.
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [version, build]
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ needs.build.outputs.image-digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Without this, trivy-action's SARIF mode deliberately ignores the
          # severity filter above and reports ALL severities.
          limit-severities-for-sarif: true
          # Narrowly-scoped, self-expiring suppressions for findings we can't act
          # on yet (e.g. Go stdlib CVEs baked into the upstream-built docker CLI
          # binary, pending a docker-ce-cli rebuild). See the file for rationale.
          trivyignores: .trivyignore.yaml
          # Package-scoped Rego suppression for the continuous stream of Linux
          # *kernel* CVEs Trivy maps to linux-libc-dev (compile-time kernel
          # headers pulled in by the native build toolchain; not reachable in a
          # container, which runs on the host kernel). See the file for rationale.
          ignore-policy: .trivy/ignore-policy.rego

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        # Releases only: dev/beta builds may be of any ref (possibly far
        # behind main), and pinning their stale results to main below would
        # corrupt the default-branch alert set. Their scan still runs above —
        # the results just stay in the job log instead of code scanning.
        if: always() && needs.version.outputs.release == 'true' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          # On a release, GITHUB_REF is the tag (refs/tags/vX.Y.Z). Code-scanning
          # alerts are tracked per-ref and only auto-close when a newer analysis
          # on the SAME ref omits them — a tag scan can never clear an alert on
          # main. Pin the upload to main (release commits are cut from main) so
          # each release reconciles the default-branch alert set instead of
          # piling up dead per-tag analyses. Between releases, security-scan.yml
          # re-scans the published image on a schedule (or on dispatch) and
          # uploads into this same stream.
          ref: refs/heads/main
          sha: ${{ github.sha }}
          # Analyses are matched per (ref, category), and with no explicit
          # category upload-sarif derives "<workflow path>:<job id>" — which
          # would differ per workflow file and silo security-scan.yml's uploads
          # away from this one. Pin the category explicitly, to the exact value
          # this job historically auto-derived, so pre-existing alerts stay in
          # the same stream. Must stay byte-identical to the category in
          # security-scan.yml's upload step.
          category: ".github/workflows/docker-image.yml:scan"

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [version, build, scan]
    if: always()
    permissions: {}

    steps:
      - name: Generate summary
        run: |
          {
            echo "## mcpelevator image"
            echo ""
            echo "- **Version:** \`${{ needs.version.outputs.version }}\`"
            echo "- **Image:** \`${{ env.GHCR_IMAGE }}\`"
            echo "- **Digest:** \`${{ needs.build.outputs.image-digest }}\`"
            echo "- **Platforms:** \`${{ env.PLATFORMS }}\`"
            echo ""
            echo "Pull: \`docker pull ${{ env.GHCR_IMAGE }}:${{ needs.version.outputs.image-tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
