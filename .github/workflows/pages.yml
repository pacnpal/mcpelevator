name: Pages

# Publishes the project site (site/) to GitHub Pages, with the UI screenshots and
# logo copied in at build time so the site always shows the current UI.
#
# The Screenshots workflow commits refreshed PNGs with GITHUB_TOKEN, which doesn't
# trigger push workflows, so this also runs after it completes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Screenshots]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp site/index.html _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp assets/mcpelevator.svg assets/mcpelevator.png _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
